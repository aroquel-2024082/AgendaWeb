<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/contacto-nuevo.css">
    <title>Agenda Web - Contacto Nuevo</title>
</head>
<body>
    
    <div class="formulario">

        <div class="titulo">
            <i class="bi bi-person-plus-fill"></i> Registra - Nuevo Contacto
        </div>

        <form action="#">
            <div class="detalles-contacto">
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-person-vcard"></i> Nombre</span>
                    <input type="text" placeholder="Ej. Angel" required>
                </div>
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-person-vcard-fill"></i> Apellido</span>
                    <input type="text" placeholder="Ej. Roquel" required>
                </div>
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-telephone"></i> No. Telefono</span>
                    <input type="text" placeholder="Ej. +502 0000-0000" required>
                </div>
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-envelope-at"></i> Correo</span>
                    <input type="text" placeholder="Ej. angel@gmail.com" required>
                </div>
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-briefcase"></i> Trabajo</span>
                    <input type="text" placeholder="Ej. Ing Software" required>
                </div>
                <div class="input-box">
                    <span class="detalles"><i class="bi bi-heart-half"></i> Estado Civil</span>
                    <input type="text" placeholder="Ej. Soltero" required>
                </div>
            </div>
            <div class="genero-detalles">
                <input type="radio" name="genero" id="punto-1">
                <input type="radio" name="genero" id="punto-2">
                <span class="genero-titulo"><i class="bi bi-gender-ambiguous"></i> Genero</span>
                <div class="opciones">
                    <label for="punto-1">
                        <span class="punto uno"></span>
                        <span class="genero">Hombre</span>
                    </label>
                    <label for="punto-2">
                        <span class="punto dos"></span>
                        <span class="genero">Mujer</span>
                    </label>
                </div>
            </div>
            <div class="boton">
                <button type="submit">
                    <i class="bi bi-check-circle-fill"></i>Agregar Contacto
                </button>
            </div>
        </form>

    </div>

</body>
</html>
