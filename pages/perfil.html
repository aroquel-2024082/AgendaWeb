<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
    <title>Agenda Web - Perfil</title>
</head>
<body>
    
    <main class="contenido-perfil">

        <section class="encabezado">
            <div class="foto">
                <img src="../assets/img/sello.svg" alt="Imagen Usuario">
            </div>
            <div class="texto-principal">
                <h1 id="nombre">Fiorentino Roquel</h1>
                <span class="rol">Administrador</span>
            </div>
        </section>

        <section class="cuerpo">

            <div class="tarjeta-dato">
                <i class="bi bi-envelope-paper-fill"></i>
                <div class="texto-dato">
                    <label>Correo Electrónico</label>
                    <p id="p-correo">fiorentino@gmail.com</p>
                </div>
            </div>

            <div class="tarjeta-dato">
                <i class="bi bi-gender-ambiguous"></i>
                <div class="texto-dato">
                    <label>Género</label>
                    <p>Masculino</p>
                </div>
            </div>

            <div class="tarjeta-dato">
                <i class="bi bi-calendar-check"></i>
                <div class="texto-dato">
                    <label>Nacimiento</label>
                    <p>14 de enero del 2000</p>
                </div>
            </div>

            <div class="tarjeta-dato">
                <i class="bi bi-shield-check"></i>
                <div class="texto-dato">
                    <label>Estado Bancario</label>
                    <p>Privado</p>
                </div>
            </div>

            <footer class="pie-pagina">
                <p>Administrador del perfil, gestionada por <strong>Agenda Mapogo</strong></p>
            </footer>

        </section>

    </main>

</body>
</html>
