<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Agenda Web - Contactos</title>
</head>
<body>
    
    <!--<div class="fondo">

        
    </div>-->

    <div class="contenedor-contactos">

        <div class="encabezado">

            <nav class="contenedor-encabezado">
                <ul>
                    <li class="bi bi-person-lines-fill"><a href="#" target="iframe-container">Contactos</a></li>
                    <li class="bi bi-suit-heart-fill"><a href="#" target="iframe-container">Favoritos</a></li>
                    <li class="bi bi-view-list"><a href="#" target="iframe-container">Pendientes</a></li>
                </ul>

                <div class="perfil">
                    <h1>Bienvenido (Usuario)</h1>
                    <img src="../assets/img/sello.svg" alt="Imagen Predeterminada">

                </div>

            </nav>

        </div>


        <div class="vista-principal">

            <div class="iframe-contactos">
                <iframe src="" frameborder="0" id="iframe-container" name="ventana-emergente"></iframe>
            </div>

            <aside class="columna-opciones">

                <div class="titulo">
                    <h3>Funciones Rapidas</h3>
                </div>

                <div class="lista-opciones">

                    <button class="opciones">Agregar Contacto <i class="bi bi-plus-circle"></i></button>
                    <button class="opciones">Agregar Recordatorio <i class="bi bi-alarm"></i></button>
                    <button class="opciones">Agregar Tarea <i class="bi bi-pencil-square"></i></button>

                </div>

                <div class="adicional">
                    <p>Selecciona una opcion y mejora la gestión de tu agenda</p>
                </div>

            </aside>

        </div>
        

    </div>

</body>
</html>
